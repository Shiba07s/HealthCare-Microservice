# Configure 'Deployment' of MySQL server
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: healthcare-k8s
  labels:
    app: mysql
    tier: database
spec:
  selector:
    matchLabels:
      app: mysql
      tier: database
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mysql
        tier: database
    spec:
      containers:
        - name: mysql
          image: mysql:5.7
          args:
            - "--ignore-db-dir=lost+found"
          env:
            # 🔹 Hardcoded root password
            - name: MYSQL_ROOT_PASSWORD
              value: Ashutosh@2000

            # 🔹 Hardcoded database name
            - name: MYSQL_DATABASE
              value: patient_service_write

            # (Optional but recommended)
            - name: MYSQL_USER
              value: appuser

            - name: MYSQL_PASSWORD
              value: Ashutosh@2000

          ports:
            - containerPort: 3306
              name: mysql
          volumeMounts:
            - name: mysql-persistent-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-persistent-storage
          persistentVolumeClaim:
            claimName: mysql-pv-claim